[package]
name = "testsprite-rs"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.102"
async-trait = "0.1.89"
axum = { version = "0.8.9", features = ["ws", "multipart"] }
bytes = "1.11.1"
clap = { version = "4.6.1", features = ["derive"] }
clap_complete = "4"
futures = "0.3.32"
hex = "0.4.3"
hmac = "0.13.0"
image = { version = "0.25.10", default-features = false, features = ["png"] }
rand = "0.10.1"
reqwest = { version = "0.13.4", default-features = false, features = ["json", "multipart", "stream", "socks", "rustls", "charset", "http2"] }
rmcp = { git = "https://github.com/modelcontextprotocol/rust-sdk.git", rev = "2e2c79173cafb7b7966eeab91f60a241c440b640", features = ["transport-io"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
serde_yaml = "0.9.34"
serenity = { git = "https://github.com/serenity-rs/serenity.git", rev = "db6c7e188717c957c7051570dda60d314b6afe2d", optional = true, default-features = false, features = ["builder", "client", "gateway", "model", "http", "utils", "rustls_backend"] }
sha2 = "0.11.0"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite"] }
thiserror = "2.0.18"
tokio = { version = "1.52.3", features = ["full"] }
tokio-tungstenite = { version = "0.29.0", features = ["rustls-tls-native-roots"] }
tokio-util = { version = "0.7.18", features = ["compat"] }
toml = "1.1.2"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
tree-sitter = "0.26.11"
tree-sitter-go = "0.25.0"
tree-sitter-javascript = "0.25.0"
tree-sitter-python = "0.25.0"
tree-sitter-rust = "0.24.2"
tree-sitter-typescript = "0.23.2"
uuid = { version = "1.23.3", features = ["v4"] }
walkdir = "2.5.0"
yamux = "0.13.10"

[features]
# The Discord bot front-end (`testsprite-rs discord`). Heavy dep tree, so opt-in:
#   cargo build --features discord
discord = ["dep:serenity"]
